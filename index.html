<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misiones Secretas</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #243b55 0%, #141e30 45%, #080b10 100%);
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 8px;
      color: #aab7c4;
      font-size: 15px;
    }

    #status {
      text-align: center;
      margin: 20px 0;
      color: #b9c6d3;
    }

    .player {
      text-align: center;
      margin: 15px 0 25px;
      font-size: 20px;
      font-weight: bold;
    }

    .mission {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      transition: 0.2s;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .mission.completed {
      opacity: 0.55;
      border-color: #36d399;
    }

    .mission-number {
      font-size: 13px;
      color: #7dd3fc;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .mission-text {
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #16805b;
      cursor: default;
    }

    .error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.4);
      border-radius: 15px;
      padding: 18px;
      color: #fecaca;
      line-height: 1.5;
    }

    /* ==========================
       NOTIFICACIÓN
       ========================== */

    #notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translate(-50%, -150%);
      width: calc(100% - 30px);
      max-width: 500px;
      background: rgba(15, 23, 42, 0.97);
      border: 1px solid rgba(96, 165, 250, 0.6);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
      z-index: 9999;
      transition: transform 0.4s ease;
      text-align: center;
    }

    #notification.show {
      transform: translate(-50%, 0);
    }

    .notification-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .notification-text {
      font-size: 16px;
      color: #dbeafe;
    }

    .notification-icon {
      font-size: 30px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<div id="notification">
  <div class="notification-icon">🎯</div>
  <div class="notification-title">
    ¡MISIÓN COMPLETADA!
  </div>
  <div class="notification-text" id="notificationText"></div>
</div>

<div class="container">

  <header>
    <div class="logo">🕵️</div>

    <h1>Misiones Secretas</h1>

    <div class="subtitle">
      Cumpleaños · Operación Secreta
    </div>
  </header>

  <div id="status">
    Preparando tus misiones...
  </div>

  <div id="player"></div>

  <div id="missions"></div>

</div>


<script>

  // ==============================
  // CONFIGURACIÓN DE SUPABASE
  // ==============================

  const SUPABASE_URL =
    "https://hsrxguauuimousgiquni.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_EGtns7ZM-uYga91abIvglg_ol_T50Ek";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // VARIABLES
  // ==============================

  let currentPlayerId = null;
  let currentPlayerName = null;


  // ==============================
  // ELEMENTOS
  // ==============================

  const statusElement =
    document.getElementById("status");

  const playerElement =
    document.getElementById("player");

  const missionsElement =
    document.getElementById("missions");

  const notificationElement =
    document.getElementById("notification");

  const notificationText =
    document.getElementById("notificationText");


  // ==============================
  // CÓDIGO DEL QR
  // ==============================

  const params =
    new URLSearchParams(window.location.search);

  const secretCode =
    params.get("c");


  // ==============================
  // INICIAR JUEGO
  // ==============================

  async function startGame() {

    try {

      if (!secretCode) {

        showError(
          "No se ha encontrado el código secreto del jugador."
        );

        return;
      }


      statusElement.textContent =
        "Conectando con la central secreta...";


      // LOGIN ANÓNIMO

      const {
        error: authError
      } = await supabaseClient.auth.signInAnonymously();


      if (authError) {
        throw authError;
      }


      // IDENTIFICAR JUGADOR

      statusElement.textContent =
        "Identificando agente...";


      const {
        data: playerData,
        error: playerError
      } = await supabaseClient.rpc(
        "claim_player",
        {
          p_secret_code: secretCode
        }
      );


      if (playerError) {
        throw playerError;
      }


      if (!playerData ||
          playerData.length === 0) {

        showError(
          "No se ha encontrado este jugador."
        );

        return;
      }


      const player =
        Array.isArray(playerData)
          ? playerData[0]
          : playerData;


      currentPlayerId =
        player.id;

      currentPlayerName =
        player.name;


      playerElement.innerHTML =
        `🎯 Agente: <strong>${escapeHtml(player.name)}</strong>`;


      // CARGAR MISIONES

      statusElement.textContent =
        "Cargando tus misiones secretas...";


      const {
        data: missions,
        error: missionsError
      } = await supabaseClient
        .from("missions")
        .select("*")
        .eq("player_id", currentPlayerId)
        .order("mission_number");


      if (missionsError) {
        throw missionsError;
      }


      if (!missions ||
          missions.length === 0) {

        showError(
          "Este agente todavía no tiene misiones asignadas."
        );

        return;
      }


      statusElement.textContent =
        "¡Operación en marcha!";


      renderMissions(missions);


      // INICIAR NOTIFICACIONES

      startRealtimeNotifications();

    }

    catch (error) {

      console.error("ERROR:", error);

      showError(
        "Ha ocurrido un error al cargar tus misiones.<br><br>" +
        "<strong>" +
        escapeHtml(
          error.message || String(error)
        ) +
        "</strong>"
      );
    }
  }


  // ==============================
  // MOSTRAR MISIONES
  // ==============================

  function renderMissions(missions) {

    missionsElement.innerHTML = "";


    missions.forEach(mission => {

      const card =
        document.createElement("div");


      card.className =
        "mission" +
        (mission.completed
          ? " completed"
          : "");


      card.innerHTML = `

        <div class="mission-number">
          Misión ${mission.mission_number}
        </div>

        <div class="mission-text">
          ${escapeHtml(mission.description)}
        </div>

        <button
          ${mission.completed ? "disabled" : ""}
          onclick="completeMission('${mission.id}', this)"
        >
          ${
            mission.completed
              ? "✓ MISIÓN COMPLETADA"
              : "MARCAR COMO COMPLETADA"
          }
        </button>

      `;


      missionsElement.appendChild(card);

    });
  }


  // ==============================
  // COMPLETAR MISIÓN
  // ==============================

  async function completeMission(
    missionId,
    button
  ) {

    button.disabled = true;

    button.textContent =
      "Guardando...";


    try {

      // MARCAR MISIÓN COMO COMPLETADA

      const {
        error: missionError
      } = await supabaseClient
        .from("missions")
        .update({
          completed: true,
          completed_at:
            new Date().toISOString()
        })
        .eq("id", missionId);


      if (missionError) {
        throw missionError;
      }


      // REGISTRAR EVENTO

      const {
        error: eventError
      } = await supabaseClient
        .from("mission_events")
        .insert({
          mission_id: missionId,
          player_id: currentPlayerId
        });


      if (eventError) {
        throw eventError;
      }


      button.textContent =
        "✓ MISIÓN COMPLETADA";


      button
        .closest(".mission")
        .classList.add("completed");

    }

    catch (error) {

      console.error(
        "ERROR:",
        error
      );

      button.disabled = false;

      button.textContent =
        "MARCAR COMO COMPLETADA";


      alert(
        "No se ha podido guardar la misión:\n\n" +
        error.message
      );
    }
  }


  // ==============================
  // NOTIFICACIONES EN TIEMPO REAL
  // ==============================

  function startRealtimeNotifications() {

    console.log(
      "Conectando a las notificaciones..."
    );


    const channel =
      supabaseClient
        .channel("mission-events-global")


        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "mission_events"
          },

          async (payload) => {

            console.log(
              "Nuevo evento:",
              payload
            );


            const event =
              payload.new;


            // Si la misión la ha completado
            // el propio jugador, NO mostramos
            // otra notificación.

            if (
              event.player_id ===
              currentPlayerId
            ) {
              return;
            }


            // Buscar el nombre del jugador

            const {
              data: player,
              error
            } = await supabaseClient
              .from("players")
              .select("name")
              .eq(
                "id",
                event.player_id
              )
              .single();


            if (error || !player) {

              console.error(
                "No se pudo obtener el jugador:",
                error
              );

              return;
            }


            // MOSTRAR NOTIFICACIÓN

            showNotification(
              player.name
            );

          }
        )


        .subscribe(
          (status) => {

            console.log(
              "Realtime:",
              status
            );

          }
        );
  }


  // ==============================
  // MOSTRAR NOTIFICACIÓN
  // ==============================

  function showNotification(
    playerName
  ) {

    notificationText.textContent =
      `${playerName} ha completado una misión`;


    notificationElement
      .classList
      .add("show");


    setTimeout(() => {

      notificationElement
        .classList
        .remove("show");

    }, 5000);
  }


  // ==============================
  // MOSTRAR ERROR
  // ==============================

  function showError(message) {

    statusElement.innerHTML = `
      <div class="error">
        ${message}
      </div>
    `;
  }


  // ==============================
  // SEGURIDAD HTML
  // ==============================

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  // ==============================
  // ARRANCAR
  // ==============================

  startGame();

</script>

</body>
</html>
</script>

</body>
</html>
